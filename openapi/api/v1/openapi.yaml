openapi: 3.0.1
info:
  title: "Ecosyste.ms: Advisories"
  description: "An open API service providing security vulnerability metadata for many open source software ecosystems."
  contact:
    name: Ecosyste.ms
    email: support@ecosyste.ms
    url: https://ecosyste.ms 
  version: 1.0.0
  license:
    name: CC-BY-SA-4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/
externalDocs:
  description: GitHub Repository
  url: https://github.com/ecosyste-ms/advisories
servers:
- url: https://advisories.ecosyste.ms/api/v1
paths:
  /patches:
    get:
      summary: List downstream patches
      operationId: getPatches
      tags: [patches]
      description: Each SHA-256 appears once per result set. All supplied filters apply to the same downstream declaration. Only matching declarations and their advisory references are returned.
      parameters:
        - {name: purl, in: query, schema: {type: string}, description: "Upstream package project or exact release PURL, or an unversioned source repository PURL."}
        - {name: distribution, in: query, schema: {type: string}, example: debian}
        - {name: advisory, in: query, schema: {type: string}, description: Identifier or known alias mentioned by a declaration}
        - {name: version_range, in: query, schema: {type: string}, description: "Native range for an unversioned gem, cargo or pypi PURL. Requires an observed upstream version."}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200':
          description: Matching patches
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Patch'}}
        '400':
          description: Invalid PURL or version range
  /patches/{id}:
    get:
      summary: Get a patch with all downstream declarations
      operationId: getPatch
      tags: [patches]
      parameters:
        - {name: id, in: path, required: true, schema: {type: integer}, description: Numeric database ID returned by the list endpoint}
      responses:
        '200':
          description: One patch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Patch'}
        '404':
          description: Patch has no indexed declarations or does not exist
  /advisories:
    get: 
      summary: "list advisories"
      operationId: "getAdvisories"
      tags:
        - advisories
      parameters:
        - name: ecosystem
          in: query
          description: "Ecosystem to filter by"
          required: false
          schema:
            type: string
        - name: package_name
          in: query
          description: "Package to filter by"
          required: false
          schema:
            type: string
        - name: severity
          in: query
          description: "Severity to filter by"
          required: false
          schema:
            type: string
        - name: version
          in: query
          description: "Return advisories whose affected ranges match this version. Requires ecosystem and package_name. Advisories without a matching range are excluded."
          required: false
          schema:
            type: string
        - name: repository_url
          in: query
          description: "Repository URL to filter by"
          required: false
          schema:
            type: string
        - name: source
          in: query
          description: "Source to filter by (e.g. github, erlef, cpansa)"
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: pagination page number 
          required: false
          schema:
            type: integer
        - name: per_page
          in: query
          description: Number of records to return 
          required: false
          schema:
            type: integer
        - name: created_after
          in: query
          description: filter by created_at after given time
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_after
          in: query
          description: filter by updated_at after given time
          required: false
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: Comma-separated advisory column names to sort by. Defaults to published_at. Unknown columns return 400.
          required: false
          schema:
            type: string
        - name: order
          in: query
          description: Comma-separated asc or desc directions corresponding to sort fields, case-insensitive. Missing directions default to desc. Invalid or extra directions return 400.
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Advisory'
        400:
          description: Invalid version filter, sort column or order direction
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /advisories/packages:
    get:
      summary: "list packages that have advisories"
      operationId: "getAdvisoriesPackages"
      tags:
        - advisories
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'
  /advisories/lookup:
    get:
      summary: "lookup advisories by Package URL (PURL) or repository URL"
      operationId: "lookupAdvisories"
      description: "Lookup security advisories for a package using Package URL (PURL) specification or by source repository URL. One of purl or repository_url must be provided. Results are deduplicated by CVE identifier."
      tags:
        - advisories
      parameters:
        - name: purl
          in: query
          description: "Package URL (PURL) to lookup advisories for. Format: pkg:type/namespace/name@version. When a version is provided, only advisories with a matching affected range are returned."
          required: false
          schema:
            type: string
          example: "pkg:npm/lodash@4.17.20"
        - name: repository_url
          in: query
          description: "Source repository URL to lookup advisories for"
          required: false
          schema:
            type: string
          example: "https://github.com/rails/rails"
      responses:
        200:
          description: "List of advisories for the specified package or repository"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Advisory'
        400:
          description: "Bad Request - Invalid or missing parameter"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "purl or repository_url parameter is required"
  /advisories/{advisoryUUID}:
    get:
      summary: get an advisory by uuid
      operationId: getAdvisory
      tags:
        - advisories
      parameters:
        - in: path
          name: advisoryUUID
          schema:
            type: string
          required: true
          description: uuid of the advisory
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
  /sources:
    get:
      summary: "list advisory sources"
      operationId: "getSources"
      tags:
        - sources
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
  /sources/{sourceKind}:
    get:
      summary: get a source by kind
      operationId: getSource
      tags:
        - sources
      parameters:
        - in: path
          name: sourceKind
          schema:
            type: string
          required: true
          description: kind of the source (e.g. github, erlef, cpansa)
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
components:
  schemas:
    Patch:
      type: object
      properties:
        id: {type: integer}
        sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of the exact patch bytes}
        api_url: {type: string, format: uri, description: Patch detail with all indexed declarations}
        html_url: {type: string, format: uri, description: Patch page identified by SHA-256}
        download_url: {type: string, format: uri, description: Original bytes. Present when the patch body is stored.}
        headers: {type: object, additionalProperties: {type: string}}
        occurrences:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              source_url: {type: string, format: uri}
              html_url: {type: string, format: uri, description: Link to this declaration on the patch page}
              upstream_package_url: {type: string, format: uri, description: Package page for the inferred upstream registry identity when available}
              status: {type: string, enum: [declared]}
              downstream:
                type: object
                properties:
                  distribution: {type: string}
                  package_name: {type: string}
                  package_url: {type: string, format: uri, description: Downstream package page}
                  version: {type: string}
                  revision: {type: string}
                  source_url: {type: string, format: uri}
                  imported_at: {type: string, format: date-time}
              project_purl: {type: string, nullable: true}
              purl: {type: string, nullable: true, description: Includes the upstream version when supported}
              source_repository:
                type: object
                description: Present when the downstream release identifies one source repository.
                required: [purl, kind, sources]
                properties:
                  purl: {type: string}
                  patches_api_url: {type: string, format: uri, description: JSON list of patches for this repository PURL}
                  patches_html_url: {type: string, format: uri, description: HTML list of patches for this repository PURL}
                  kind: {type: string, enum: [release_source_declaration, changed_file_match]}
                  archive_sha256: {type: string, description: Digest of the packaging archive containing the declaration}
                  sources:
                    type: array
                    items:
                      type: object
                      properties:
                        field: {type: string}
                        url: {type: string, format: uri}
                        purl: {type: string}
                  comparison:
                    type: object
                    description: Comparison of original source files to a Git tree. The commit identifies the comparison tree only.
                    properties:
                      commit_checked: {type: string}
                      debian_original: {type: object, description: Name, size and SHA-256 of the original source archive}
                      paths: {type: integer}
                      identical: {type: integer}
                      differing_or_absent: {type: array, items: {type: string}}
                      all_paths_corroborated: {type: boolean}
              mapping: {type: object, description: Status and evidence for the inferred package relationship}
              scope_evidence: {type: object, description: Changed paths and any reason to withhold attribution}
              declaration: {type: object, description: Source metadata and fields containing each advisory identifier}
              advisory_ids: {type: array, items: {type: string}}
              advisory_roles:
                type: object
                additionalProperties: {type: string, enum: [explicit_fix, patch_name, context]}
              assertions:
                type: object
                properties:
                  declared: {type: object}
                  attributed: {type: array, items: {type: object}}
                  verified: {type: object, nullable: true, description: Null for these source declarations}
        referenced_advisories:
          type: array
          items:
            type: object
            properties:
              uuid: {type: string}
              url: {type: string, nullable: true}
              api_url: {type: string, format: uri}
              html_url: {type: string, format: uri}
              withdrawn_at: {type: string, format: date-time, nullable: true}
              affected_packages: {type: array, items: {type: object}}
              matched_identifiers: {type: array, items: {type: string}}
    Advisory:
      type: object
      properties:
        uuid:
          type: string
        url:
          type: string
        title:
          type: string
        description:
          type: string
        origin:
          type: string
        severity:
          type: string
        published_at:
          type: string
        withdrawn_at:
          type: string
        classification:
          type: string
        cvss_score:
          type: number
        cvss_vector:
          type: string
        references:
          type: array
          items:
            type: string
        source_kind:
          type: string
        identifiers:
          type: array
          items:
            type: string
        repository_url:
          type: string
        blast_radius:
          type: number
        packages:
          type: array
          items:
            $ref: '#/components/schemas/PackageWithDetails'
        created_at:
          type: string
        updated_at:
          type: string
        epss_percentage:
          type: number
        epss_percentile:
          type: number
        api_url:
          type: string
          description: "API URL for this advisory"
        html_url:
          type: string
          description: "HTML URL for this advisory"
        related_advisories:
          type: array
          description: "Advisories from other sources for the same vulnerability (matched by CVE)"
          items:
            $ref: '#/components/schemas/RelatedAdvisory'
    RelatedAdvisory:
      type: object
      properties:
        uuid:
          type: string
        source_kind:
          type: string
        url:
          type: string
    Source:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
        url:
          type: string
        advisories_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    Package:
      type: object
      properties:
        ecosystem:
          type: string
        package_name:
          type: string
    PackageWithDetails:
      type: object
      properties:
        ecosystem:
          type: string
        package_name:
          type: string
        purl:
          type: string
          description: "Package URL (PURL) for this package"
          example: "pkg:npm/lodash"
        versions:
          type: array
          items:
            type: object
            properties:
              vulnerable_version_range:
                type: string
              first_patched_version:
                type: string
        statistics:
          type: object
          properties:
            dependent_packages_count:
              type: integer
            dependent_repos_count:
              type: integer
            downloads:
              type: integer
            downloads_period:
              type: string
        affected_versions:
          type: array
          items:
            type: string
        unaffected_versions:
          type: array
          items:
            type: string
