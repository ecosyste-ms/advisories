openapi: 3.0.1
info:
  title: "Ecosyste.ms: Advisories"
  description: "An open API service providing security vulnerability metadata for many open source software ecosystems."
  contact:
    name: Ecosyste.ms
    email: support@ecosyste.ms
    url: https://ecosyste.ms 
  version: 1.0.0
  license:
    name: CC-BY-SA-4.0
    url: https://creativecommons.org/licenses/by-sa/4.0/
externalDocs:
  description: GitHub Repository
  url: https://github.com/ecosyste-ms/advisories
servers:
- url: https://advisories.ecosyste.ms/api/v1
paths:
  /patches:
    get:
      summary: List downstream patches
      operationId: getPatches
      tags: [patches]
      description: Patches that distributions apply on top of upstream source. Each SHA-256 appears once. All filters apply to the same declaration, and only matching declarations are returned.
      parameters:
        - {name: purl, in: query, schema: {type: string}, description: "A registry package (pkg:cargo/h2), matched through its repository URL, with an optional upstream version. Also accepts pkg:github, pkg:deb/debian, pkg:deb/ubuntu and pkg:brew."}
        - {name: repository_url, in: query, schema: {type: string}, description: Upstream repository the downstream release declares}
        - {name: advisory, in: query, schema: {type: string}, description: Advisory identifier or any of its aliases named by a declaration}
        - {name: distribution, in: query, schema: {type: string, enum: [debian, homebrew, ubuntu]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1, maximum: 1000, default: 100}}
      responses:
        '200':
          description: Matching patches
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Patch'}}
        '400':
          description: Invalid PURL
  /patches/{sha256}:
    get:
      summary: Get a patch with all downstream declarations
      operationId: getPatch
      tags: [patches]
      parameters:
        - {name: sha256, in: path, required: true, schema: {type: string, pattern: '^[0-9a-f]{64}$'}}
      responses:
        '200':
          description: One patch
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Patch'}
        '404':
          description: No release declares a patch with this digest
  /advisories:
    get: 
      summary: "list advisories"
      operationId: "getAdvisories"
      tags:
        - advisories
      parameters:
        - name: ecosystem
          in: query
          description: "Ecosystem to filter by"
          required: false
          schema:
            type: string
        - name: package_name
          in: query
          description: "Package to filter by"
          required: false
          schema:
            type: string
        - name: severity
          in: query
          description: "Severity to filter by"
          required: false
          schema:
            type: string
        - name: version
          in: query
          description: "Return advisories whose affected ranges match this version. Requires ecosystem and package_name. Advisories without a matching range are excluded."
          required: false
          schema:
            type: string
        - name: repository_url
          in: query
          description: "Repository URL to filter by"
          required: false
          schema:
            type: string
        - name: source
          in: query
          description: "Source to filter by (e.g. github, erlef, cpansa, osv)"
          required: false
          schema:
            type: string
        - name: page
          in: query
          description: pagination page number 
          required: false
          schema:
            type: integer
        - name: per_page
          in: query
          description: Number of records to return 
          required: false
          schema:
            type: integer
        - name: created_after
          in: query
          description: filter by created_at after given time
          required: false
          schema:
            type: string
            format: date-time
        - name: updated_after
          in: query
          description: filter by updated_at after given time
          required: false
          schema:
            type: string
            format: date-time
        - name: sort
          in: query
          description: Comma-separated advisory column names to sort by. Defaults to published_at. Unknown columns return 400.
          required: false
          schema:
            type: string
        - name: order
          in: query
          description: Comma-separated asc or desc directions corresponding to sort fields, case-insensitive. Missing directions default to desc. Invalid or extra directions return 400.
          required: false
          schema:
            type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Advisory'
        400:
          description: Invalid version filter, sort column or order direction
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /advisories/packages:
    get:
      summary: "list packages that have advisories"
      operationId: "getAdvisoriesPackages"
      tags:
        - advisories
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Package'
  /advisories/lookup:
    get:
      summary: "lookup advisories by Package URL (PURL) or repository URL"
      operationId: "lookupAdvisories"
      description: "Lookup security advisories for a package using Package URL (PURL) specification or by source repository URL. One of purl or repository_url must be provided. Results are deduplicated by CVE identifier."
      tags:
        - advisories
      parameters:
        - name: purl
          in: query
          description: "Package URL (PURL) to lookup advisories for. Format: pkg:type/namespace/name@version. When a version is provided, only advisories with a matching affected range are returned."
          required: false
          schema:
            type: string
          example: "pkg:npm/lodash@4.17.20"
        - name: repository_url
          in: query
          description: "Source repository URL to lookup advisories for"
          required: false
          schema:
            type: string
          example: "https://github.com/rails/rails"
      responses:
        200:
          description: "List of advisories for the specified package or repository"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Advisory'
        400:
          description: "Bad Request - Invalid or missing parameter"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "purl or repository_url parameter is required"
  /advisories/{advisoryUUID}:
    get:
      summary: get an advisory by uuid
      operationId: getAdvisory
      tags:
        - advisories
      parameters:
        - in: path
          name: advisoryUUID
          schema:
            type: string
          required: true
          description: uuid of the advisory
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advisory'
  /advisories/{advisoryUUID}/downstream_releases:
    get:
      summary: list downstream releases of the advisory's packages
      operationId: getAdvisoryDownstreamReleases
      tags:
        - advisories
      description: Distribution releases that name one of the advisory's packages as their upstream, at any version. `affected` says whether the upstream version a release ships is in the advisory's affected range.
      parameters:
        - {name: advisoryUUID, in: path, required: true, schema: {type: string}, description: uuid of the advisory}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: per_page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/PatchRelease'
                    - type: object
                      properties:
                        affected: {type: boolean}
                        patches_count: {type: integer, description: Patches the release carries}
  /sources:
    get:
      summary: "list advisory sources"
      operationId: "getSources"
      tags:
        - sources
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Source'
  /sources/{sourceKind}:
    get:
      summary: get a source by kind
      operationId: getSource
      tags:
        - sources
      parameters:
        - in: path
          name: sourceKind
          schema:
            type: string
          required: true
          description: kind of the source (e.g. github, erlef, cpansa, osv)
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
components:
  schemas:
    Patch:
      type: object
      properties:
        sha256: {type: string, pattern: '^[0-9a-f]{64}$', description: Digest of the exact patch bytes}
        byte_size: {type: integer}
        headers: {type: object, additionalProperties: {type: string}, description: "Fields from the patch preamble, such as Subject, Origin, Forwarded and Applied-Upstream"}
        api_url: {type: string, format: uri}
        html_url: {type: string, format: uri}
        download_url: {type: string, format: uri, description: Original bytes}
        occurrences:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              position: {type: integer, description: Order in which the release applies it}
              source_url: {type: string, format: uri}
              html_url: {type: string, format: uri}
              advisory_ids: {type: array, items: {type: string}}
              advisory_roles:
                type: object
                additionalProperties: {type: string, enum: [explicit_fix, patch_name, context]}
              declaration: {type: object, description: How the release declares the patch and which fields mention each advisory}
              release: {$ref: '#/components/schemas/PatchRelease'}
        referenced_advisories:
          type: array
          items:
            type: object
            properties:
              uuid: {type: string}
              url: {type: string, nullable: true}
              withdrawn_at: {type: string, format: date-time, nullable: true}
              matched_identifiers: {type: array, items: {type: string}}
              api_url: {type: string, format: uri}
              html_url: {type: string, format: uri}
    PatchRelease:
      type: object
      properties:
        distribution: {type: string}
        package_name: {type: string}
        version: {type: string}
        upstream_version: {type: string, nullable: true, description: Upstream version the release is based on}
        repository_url: {type: string, nullable: true, description: Upstream repository the release declares}
        upstream_ecosystem: {type: string, nullable: true, description: "Registry of the package the release was built from, when its packaging names one"}
        upstream_package_name: {type: string, nullable: true}
        upstream_purl: {type: string, nullable: true, example: "pkg:cargo/h2"}
        source_url: {type: string, format: uri}
        imported_at: {type: string, format: date-time}
        package_url: {type: string, format: uri}
    Advisory:
      type: object
      properties:
        uuid:
          type: string
        url:
          type: string
        title:
          type: string
        description:
          type: string
        origin:
          type: string
        severity:
          type: string
        published_at:
          type: string
        withdrawn_at:
          type: string
        classification:
          type: string
        cvss_score:
          type: number
        cvss_vector:
          type: string
        references:
          type: array
          items:
            type: string
        source_kind:
          type: string
        identifiers:
          type: array
          items:
            type: string
        repository_url:
          type: string
        blast_radius:
          type: number
        packages:
          type: array
          items:
            $ref: '#/components/schemas/PackageWithDetails'
        created_at:
          type: string
        updated_at:
          type: string
        epss_percentage:
          type: number
        epss_percentile:
          type: number
        api_url:
          type: string
          description: "API URL for this advisory"
        html_url:
          type: string
          description: "HTML URL for this advisory"
        related_advisories:
          type: array
          description: "Advisories from other sources for the same vulnerability (matched by CVE)"
          items:
            $ref: '#/components/schemas/RelatedAdvisory'
    RelatedAdvisory:
      type: object
      properties:
        uuid:
          type: string
        source_kind:
          type: string
        url:
          type: string
    Source:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        kind:
          type: string
        url:
          type: string
        advisories_count:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string
    Package:
      type: object
      properties:
        ecosystem:
          type: string
        package_name:
          type: string
    PackageWithDetails:
      type: object
      properties:
        ecosystem:
          type: string
        package_name:
          type: string
        purl:
          type: string
          description: "Package URL (PURL) for this package"
          example: "pkg:npm/lodash"
        versions:
          type: array
          items:
            type: object
            properties:
              vulnerable_version_range:
                type: string
              first_patched_version:
                type: string
        statistics:
          type: object
          properties:
            dependent_packages_count:
              type: integer
            dependent_repos_count:
              type: integer
            downloads:
              type: integer
            downloads_period:
              type: string
        affected_versions:
          type: array
          items:
            type: string
        unaffected_versions:
          type: array
          items:
            type: string
